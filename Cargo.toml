[package]
name = "dev-idp"
version = "0.0.1"
edition = "2021"
description = "A minimal OpenID Connect (OIDC) mock provider for local development and automated testing"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Nerven/dev-idp"

[dependencies]
axum = "0.8"
base64 = "0.22"
form_urlencoded = "1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml_edit = { version = "0.25", features = ["serde"] }
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
strip = true
lto = true

[profile.dist]
inherits = "release"
